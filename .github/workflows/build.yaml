name: Check SpookyV4 DEV build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build DEV runtime
        run: node tools/build-dev.js
      - name: Confirm generated output is committed
        run: git diff --exit-code -- dev-build
